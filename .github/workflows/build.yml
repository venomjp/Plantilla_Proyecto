name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Solo publica si el repositorio es público (en uno privado el job se omite)
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # historial completo (fechas de última modificación)

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm              # cachea ~/.npm con la clave basada en package-lock.json

      - name: Cache Eleventy .cache
        uses: actions/cache@v5
        with:
          path: .cache
          key: eleventy-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: eleventy-cache-${{ runner.os }}-

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Nombre del repo = prefijo de rutas. Si el repo es <usuario>.github.io, usar "/"
          PATH_PREFIX: /${{ github.event.repository.name }}/

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: ${{ github.event.repository.private == false }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
